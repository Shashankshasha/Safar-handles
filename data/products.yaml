brand: Safar
bottle_design: >
  Diamond-cut crystal bottle — faceted like a polished diamond, chrome vent-clip cap,
  designed to catch light on the dashboard or AC vent. Shared silhouette across the
  whole range; each fragrance is distinguished by liquid colour and cap trim.

# One fragrance is "featured" each weekday (Mon-Fri). Weekends spotlight the
# diamond bottle design itself / rotate a best-seller poll instead of a single scent.
fragrances:
  - id: oud-voyage
    name: "Safar Oud Voyage"
    tagline: "Bold oud for long highway drives"
    scent_notes: [oud, amber, leather]
    liquid_color: "black-gold"
    image_dir: assets/products/oud-voyage
    weekday: 0 # Monday

  - id: citrus-drift
    name: "Safar Citrus Drift"
    tagline: "Zesty citrus burst for the morning commute"
    scent_notes: [orange, lemon, mint]
    liquid_color: "yellow-clear"
    image_dir: assets/products/citrus-drift
    weekday: 1 # Tuesday

  - id: musk-highway
    name: "Safar Musk Highway"
    tagline: "Smooth musk for smooth rides"
    scent_notes: [white musk, sandalwood]
    liquid_color: "white-silver"
    image_dir: assets/products/musk-highway
    weekday: 2 # Wednesday

  - id: lavender-cruise
    name: "Safar Lavender Cruise"
    tagline: "Calm lavender for stress-free traffic"
    scent_notes: [lavender, vanilla]
    liquid_color: "purple"
    image_dir: assets/products/lavender-cruise
    weekday: 3 # Thursday

  - id: woody-trail
    name: "Safar Woody Trail"
    tagline: "Earthy woody trail for off-road spirits"
    scent_notes: [cedarwood, vetiver]
    liquid_color: "brown-green"
    image_dir: assets/products/woody-trail
    weekday: 4 # Friday

weekend_spotlight:
  id: diamond-bottle-hero
  name: "The Safar Diamond Bottle"
  tagline: "One iconic cut. Five signature journeys."
  image_dir: assets/products/diamond-bottle-hero
