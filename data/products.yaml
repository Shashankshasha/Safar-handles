brand: Safar
maker: "Grace One"
tagline: "Invisible Luxury"
website: "https://graceone.in"
bottle_design: >
  Hanging car aroma diffuser — a faceted diamond-cut glass bottle beneath a
  beech-wood pyramid cap, strung on a braided cord with a carved wooden bead,
  designed to hang from the rearview mirror. Natural plant extracts, no added
  alcohol, heat resistant (no deformation in summer), fragrance lasts up to
  60 days. Shared silhouette across the whole range; each fragrance is
  distinguished by the glass colour.

# One fragrance is "featured" each weekday (Mon-Fri). Weekends spotlight the
